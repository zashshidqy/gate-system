; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
;  DUA UNIT — ENTRY & EXIT
;  Melalui pre-build script (scripts/set_src_dir.py), tiap env
;  memakai src_dir masing-masing:
;    - env esp32doit-devkit-v1 → src/entry  (gerbang masuk)
;    - env esp32-exit           → src/exit   (gerbang keluar)
;  Setiap folder unit berisi main.cpp + config.h khusus.
;  build_flags -I<unit> agar library bersama di lib/ menemukan
;  config.h unit yang sedang dikompilasi.
;
;  Ketiga folder berisi main.cpp + config.h khusus.
;  Library bersama tetap di lib/ (ultrasonic, rfid_reader,
;  gate_controller, status_report).
;
;  Upload:
;    pio run -e esp32doit-devkit-v1 -t upload   (unit ENTRY)
;    pio run -e esp32-exit      -t upload        (unit EXIT)
; ============================================================

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
extra_scripts = pre:scripts/set_src_dir.py
build_flags =
    -Isrc/entry
lib_deps =
    madhephaestus/ESP32Servo@^1.2.1
    miguelbalboa/MFRC522@^1.4.11

[env:esp32-exit]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
extra_scripts = pre:scripts/set_src_dir.py
build_flags =
    -Isrc/exit
lib_deps =
    madhephaestus/ESP32Servo@^1.2.1
    miguelbalboa/MFRC522@^1.4.11