[project]
name = "gate-dashboard"
version = "0.1.0"
description = "Staff Dashboard for Smart Gate System with Ticket Token Support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20"]
lint.ignore = ["ANN101", "ANN102", "T201"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the `app` package importable when pytest is run from backend/.
pythonpath = ["."]